name: Apply latest Codex 293 lexer fixes
on:
  push:
    paths:
      - '.github/workflows/fix-codex-293-lexer-round2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-hardening
      - name: Patch lexer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParser.java')
          s = p.read_text()

          old = '''\t\tString previousWord = previousIdentifier(script, previousIndex);\n\t\treturn REGEX_PREFIX_KEYWORDS.contains(previousWord);'''
          new = '''\t\treturn isStandaloneRegexPrefixKeyword(script, previousIndex);'''
          if old not in s:
              raise SystemExit('regex-prefix replacement target not found')
          s = s.replace(old, new, 1)

          marker = '''\tprivate static boolean isStandaloneControlHead(String script, int keywordEnd, Deque<Boolean> statementBraces) {'''
          helper = '''\tprivate static boolean isStandaloneRegexPrefixKeyword(String script, int keywordEnd) {\n\t\tString keyword = previousIdentifier(script, keywordEnd);\n\t\tif (!REGEX_PREFIX_KEYWORDS.contains(keyword)) {\n\t\t\treturn false;\n\t\t}\n\t\tint keywordStart = identifierStart(script, keywordEnd);\n\t\tint beforeKeyword = previousNonWhitespace(script, keywordStart - 1);\n\t\treturn beforeKeyword < 0 || script.charAt(beforeKeyword) != '.';\n\t}\n\n'''
          if marker not in s:
              raise SystemExit('standalone-control marker not found')
          s = s.replace(marker, helper + marker, 1)

          old = '''\t\tint tokenEnd = previousNonWhitespace(script, openParenIndex - 1);\n\t\tif (tokenEnd < 0 || !Character.isJavaIdentifierPart(script.charAt(tokenEnd))) {\n\t\t\treturn false;\n\t\t}'''
          new = '''\t\tint tokenEnd = previousNonWhitespace(script, openParenIndex - 1);\n\t\tif (tokenEnd >= 0 && script.charAt(tokenEnd) == '*') {\n\t\t\ttokenEnd = previousNonWhitespace(script, tokenEnd - 1);\n\t\t}\n\t\tif (tokenEnd < 0 || !Character.isJavaIdentifierPart(script.charAt(tokenEnd))) {\n\t\t\treturn false;\n\t\t}'''
          if old not in s:
              raise SystemExit('function-parameter replacement target not found')
          s = s.replace(old, new, 1)

          old = '''\t\tif (prefix == '>' && prefixIndex > 0 && script.charAt(prefixIndex - 1) == '=') {\n\t\t\t// Arrow-function bodies are part of an expression. Their closing brace is an\n\t\t\t// operand and must not make a following slash look like a regex statement.\n\t\t\treturn false;\n\t\t}\n\t\treturn BLOCK_PREFIX_KEYWORDS.contains(previousIdentifier(script, prefixIndex));\n\t}\n\n\tprivate static boolean opensFunctionExpressionParameters'''
          new = '''\t\tif (prefix == '>' && prefixIndex > 0 && script.charAt(prefixIndex - 1) == '=') {\n\t\t\t// Arrow-function bodies are part of an expression. Their closing brace is an\n\t\t\t// operand and must not make a following slash look like a regex statement.\n\t\t\treturn false;\n\t\t}\n\t\tif (opensClassDeclarationBody(script, prefixIndex, statementBraces)) {\n\t\t\treturn true;\n\t\t}\n\t\treturn BLOCK_PREFIX_KEYWORDS.contains(previousIdentifier(script, prefixIndex));\n\t}\n\n\tprivate static boolean opensClassDeclarationBody(String script, int prefixIndex, Deque<Boolean> statementBraces) {\n\t\tint cursor = prefixIndex;\n\t\tint parenDepth = 0;\n\t\tint bracketDepth = 0;\n\t\twhile (cursor >= 0) {\n\t\t\tchar current = script.charAt(cursor);\n\t\t\tif (Character.isWhitespace(current)) {\n\t\t\t\tcursor--;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (current == ')') {\n\t\t\t\tparenDepth++;\n\t\t\t\tcursor--;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (current == '(' && parenDepth > 0) {\n\t\t\t\tparenDepth--;\n\t\t\t\tcursor--;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (current == ']') {\n\t\t\t\tbracketDepth++;\n\t\t\t\tcursor--;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (current == '[' && bracketDepth > 0) {\n\t\t\t\tbracketDepth--;\n\t\t\t\tcursor--;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (parenDepth > 0 || bracketDepth > 0) {\n\t\t\t\tcursor--;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (Character.isJavaIdentifierPart(current)) {\n\t\t\t\tint start = identifierStart(script, cursor);\n\t\t\t\tString word = script.substring(start, cursor + 1);\n\t\t\t\tif (word.equals("class")) {\n\t\t\t\t\tint beforeClass = previousNonWhitespace(script, start - 1);\n\t\t\t\t\treturn isClassDeclarationBoundary(script, beforeClass, statementBraces);\n\t\t\t\t}\n\t\t\t\tcursor = previousNonWhitespace(script, start - 1);\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif ("=?:,;".indexOf(current) >= 0) {\n\t\t\t\treturn false;\n\t\t\t}\n\t\t\tcursor--;\n\t\t}\n\t\treturn false;\n\t}\n\n\tprivate static boolean isClassDeclarationBoundary(String script, int beforeClass, Deque<Boolean> statementBraces) {\n\t\tif (isStatementBoundary(script, beforeClass, statementBraces)) {\n\t\t\treturn true;\n\t\t}\n\t\tif (beforeClass < 0 || !Character.isJavaIdentifierPart(script.charAt(beforeClass))) {\n\t\t\treturn false;\n\t\t}\n\t\tString previousWord = previousIdentifier(script, beforeClass);\n\t\tif (previousWord.equals("export")) {\n\t\t\tint exportStart = identifierStart(script, beforeClass);\n\t\t\treturn isStatementBoundary(script, previousNonWhitespace(script, exportStart - 1), statementBraces);\n\t\t}\n\t\tif (previousWord.equals("default")) {\n\t\t\tint defaultStart = identifierStart(script, beforeClass);\n\t\t\tint beforeDefault = previousNonWhitespace(script, defaultStart - 1);\n\t\t\tif (beforeDefault >= 0 && previousIdentifier(script, beforeDefault).equals("export")) {\n\t\t\t\tint exportStart = identifierStart(script, beforeDefault);\n\t\t\t\treturn isStatementBoundary(script, previousNonWhitespace(script, exportStart - 1), statementBraces);\n\t\t\t}\n\t\t}\n\t\treturn false;\n\t}\n\n\tprivate static boolean opensFunctionExpressionParameters'''
          if old not in s:
              raise SystemExit('statement-block replacement target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "Ben"
          git config user.email "benbergen12@gmail.com"
          git rm .github/workflows/fix-codex-293-lexer-round2.yml
          git add AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParser.java
          git commit -m "Harden JavaScript lexer keyword and class contexts"
          git push origin HEAD:security/javascript-placeholder-hardening
