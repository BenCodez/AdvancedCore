name: Fix latest JavaScript fallback findings
on:
  push:
    branches:
      - security/javascript-placeholder-bindings
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-bindings
      - name: Apply fallback fixes
        run: python3 .github/fix-302-latest.py
      - name: Commit fixes
        run: |
          rm -f .github/fix-302-latest.py .github/workflows/fix-302-template-division.yml
          git config user.name 'Ben'
          git config user.email 'benbergen12@gmail.com'
          git add -A
          git commit -m 'Harden JavaScript fallback contexts'
          git push origin HEAD:security/javascript-placeholder-bindings
