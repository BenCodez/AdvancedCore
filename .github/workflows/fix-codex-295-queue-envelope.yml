name: Apply Codex 295 queue envelope fix

on:
  push:
    branches:
      - security/reward-path-identity-hardening
    paths:
      - .github/workflows/fix-codex-295-queue-envelope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/reward-path-identity-hardening
          fetch-depth: 0
      - name: Replace ambiguous queue suffix with versioned envelope
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/user/AdvancedCoreUser.java')
          text = p.read_text()
          if 'import java.nio.charset.StandardCharsets;' not in text:
              text = text.replace('import java.text.SimpleDateFormat;\n', 'import java.nio.charset.StandardCharsets;\nimport java.text.SimpleDateFormat;\n', 1)
          if 'import java.util.Base64;' not in text:
              text = text.replace('import java.util.ArrayList;\n', 'import java.util.ArrayList;\nimport java.util.Base64;\n', 1)
          text = text.replace('private static final String QUEUED_SNAPSHOT_MARKER = "%generatedsnapshot%";',
                              'private static final String QUEUED_REFERENCE_PREFIX = "\\\\AdvancedCoreQueue/1/";', 1)
          old = '''\tprivate String queuedRewardReference(Reward reward) {\n\t\treturn reward.getRewardName() + QUEUED_SNAPSHOT_MARKER + reward.isGeneratedSnapshotCreated();\n\t}\n'''
          new = '''\tprivate String queuedRewardReference(Reward reward) {\n\t\tString encodedName = Base64.getUrlEncoder().withoutPadding()\n\t\t\t\t.encodeToString(reward.getRewardName().getBytes(StandardCharsets.UTF_8));\n\t\treturn QUEUED_REFERENCE_PREFIX + (reward.isGeneratedSnapshotCreated() ? "snapshot/" : "normal/")\n\t\t\t\t+ encodedName;\n\t}\n'''
          if old not in text:
              raise SystemExit('queuedRewardReference method not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/rewards/RewardExecutor.java')
          text = p.read_text()
          if 'import java.nio.charset.StandardCharsets;' not in text:
              text = text.replace('import java.util.ArrayList;\n', 'import java.nio.charset.StandardCharsets;\nimport java.util.ArrayList;\nimport java.util.Base64;\n', 1)
          text = text.replace('private static final String QUEUED_SNAPSHOT_MARKER = "%generatedsnapshot%";',
                              'private static final String QUEUED_REFERENCE_PREFIX = "\\\\AdvancedCoreQueue/1/";', 1)
          old = '''        String rewardName = reward;\n        Boolean generatedSnapshot = null;\n        int snapshotMarker = reward.lastIndexOf(QUEUED_SNAPSHOT_MARKER);\n        if (snapshotMarker >= 0) {\n            String markerValue = reward.substring(snapshotMarker + QUEUED_SNAPSHOT_MARKER.length());\n            if (markerValue.equalsIgnoreCase("true") || markerValue.equalsIgnoreCase("false")) {\n                rewardName = reward.substring(0, snapshotMarker);\n                generatedSnapshot = Boolean.valueOf(markerValue);\n            }\n        }\n\n        Reward resolved;\n'''
          new = '''        String rewardName = reward;\n        Boolean generatedSnapshot = null;\n        if (reward.startsWith(QUEUED_REFERENCE_PREFIX)) {\n            String encoded = reward.substring(QUEUED_REFERENCE_PREFIX.length());\n            int modeEnd = encoded.indexOf('/');\n            if (modeEnd > 0) {\n                String mode = encoded.substring(0, modeEnd);\n                String encodedName = encoded.substring(modeEnd + 1);\n                if ((mode.equals("snapshot") || mode.equals("normal")) && !encodedName.isEmpty()) {\n                    try {\n                        rewardName = new String(Base64.getUrlDecoder().decode(encodedName), StandardCharsets.UTF_8);\n                        generatedSnapshot = Boolean.valueOf(mode.equals("snapshot"));\n                    } catch (IllegalArgumentException ignored) {\n                        rewardName = reward;\n                    }\n                }\n            }\n        }\n\n        Reward resolved;\n'''
          if old not in text:
              raise SystemExit('RewardExecutor queue suffix block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-codex-295-queue-envelope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use unambiguous persisted reward queue references"
          git push origin HEAD:security/reward-path-identity-hardening
