name: Apply Codex 293 function-expression lexer fix

on:
  push:
    branches:
      - security/javascript-placeholder-hardening
    paths:
      - .github/workflows/fix-codex-293-function-expression-block.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-hardening
          fetch-depth: 0
      - name: Distinguish expression bodies from statement blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParser.java')
          text = parser.read_text()

          text = text.replace(
              'Deque<Boolean> controlParens = new ArrayDeque<>();\n\t\tDeque<Boolean> statementBraces = new ArrayDeque<>();',
              'Deque<Boolean> controlParens = new ArrayDeque<>();\n\t\tDeque<Boolean> functionExpressionParens = new ArrayDeque<>();\n\t\tDeque<Boolean> statementBraces = new ArrayDeque<>();', 1)
          text = text.replace(
              'int lastControlHeadClose = -1;\n\t\tint lastStatementBlockClose = -1;',
              'int lastControlHeadClose = -1;\n\t\tint lastFunctionExpressionParenClose = -1;\n\t\tint lastStatementBlockClose = -1;', 1)

          old = '''\t\t\tif (current == '(') {\n\t\t\t\tint keywordEnd = previousNonWhitespace(script, i - 1);\n\t\t\t\tcontrolParens.push(isStandaloneControlHead(script, keywordEnd, statementBraces));\n\t\t\t} else if (current == ')' && !controlParens.isEmpty()) {\n\t\t\t\tif (controlParens.pop()) {\n\t\t\t\t\tlastControlHeadClose = i;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif (current == '{') {\n\t\t\t\tstatementBraces.push(opensStatementBlock(script, i, statementBraces));'''
          new = '''\t\t\tif (current == '(') {\n\t\t\t\tint keywordEnd = previousNonWhitespace(script, i - 1);\n\t\t\t\tcontrolParens.push(isStandaloneControlHead(script, keywordEnd, statementBraces));\n\t\t\t\tfunctionExpressionParens.push(opensFunctionExpressionParameters(script, i, statementBraces));\n\t\t\t} else if (current == ')' && !controlParens.isEmpty()) {\n\t\t\t\tif (controlParens.pop()) {\n\t\t\t\t\tlastControlHeadClose = i;\n\t\t\t\t}\n\t\t\t\tif (!functionExpressionParens.isEmpty() && functionExpressionParens.pop()) {\n\t\t\t\t\tlastFunctionExpressionParenClose = i;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif (current == '{') {\n\t\t\t\tstatementBraces.push(opensStatementBlock(script, i, statementBraces, lastFunctionExpressionParenClose));'''
          if old not in text:
              raise SystemExit('paren/brace block not found')
          text = text.replace(old, new, 1)

          old = '''\tprivate static boolean opensStatementBlock(String script, int openBraceIndex, Deque<Boolean> statementBraces) {\n\t\tint prefixIndex = previousNonWhitespace(script, openBraceIndex - 1);\n\t\tif (prefixIndex < 0) {\n\t\t\treturn true;\n\t\t}\n\t\tchar prefix = script.charAt(prefixIndex);\n\t\tif (prefix == ')' || prefix == '}' || prefix == ';') {\n\t\t\treturn true;\n\t\t}\n\t\tif (prefix == ':') {\n\t\t\treturn followsStatementLabel(script, prefixIndex, statementBraces);\n\t\t}\n\t\tif (prefix == '>' && prefixIndex > 0 && script.charAt(prefixIndex - 1) == '=') {\n\t\t\treturn true;\n\t\t}\n\t\treturn BLOCK_PREFIX_KEYWORDS.contains(previousIdentifier(script, prefixIndex));\n\t}\n'''
          new = '''\tprivate static boolean opensStatementBlock(String script, int openBraceIndex, Deque<Boolean> statementBraces,\n\t\t\tint lastFunctionExpressionParenClose) {\n\t\tint prefixIndex = previousNonWhitespace(script, openBraceIndex - 1);\n\t\tif (prefixIndex < 0) {\n\t\t\treturn true;\n\t\t}\n\t\tchar prefix = script.charAt(prefixIndex);\n\t\tif (prefix == ')') {\n\t\t\treturn prefixIndex != lastFunctionExpressionParenClose;\n\t\t}\n\t\tif (prefix == '}' || prefix == ';') {\n\t\t\treturn true;\n\t\t}\n\t\tif (prefix == ':') {\n\t\t\treturn followsStatementLabel(script, prefixIndex, statementBraces);\n\t\t}\n\t\tif (prefix == '>' && prefixIndex > 0 && script.charAt(prefixIndex - 1) == '=') {\n\t\t\t// Arrow-function bodies are part of an expression. Their closing brace is an\n\t\t\t// operand and must not make a following slash look like a regex statement.\n\t\t\treturn false;\n\t\t}\n\t\treturn BLOCK_PREFIX_KEYWORDS.contains(previousIdentifier(script, prefixIndex));\n\t}\n\n\tprivate static boolean opensFunctionExpressionParameters(String script, int openParenIndex,\n\t\t\tDeque<Boolean> statementBraces) {\n\t\tint tokenEnd = previousNonWhitespace(script, openParenIndex - 1);\n\t\tif (tokenEnd < 0 || !Character.isJavaIdentifierPart(script.charAt(tokenEnd))) {\n\t\t\treturn false;\n\t\t}\n\n\t\tString token = previousIdentifier(script, tokenEnd);\n\t\tint functionEnd;\n\t\tboolean anonymous;\n\t\tif (token.equals("function")) {\n\t\t\tfunctionEnd = tokenEnd;\n\t\t\tanonymous = true;\n\t\t} else {\n\t\t\tint tokenStart = identifierStart(script, tokenEnd);\n\t\t\tint beforeName = previousNonWhitespace(script, tokenStart - 1);\n\t\t\tif (beforeName >= 0 && script.charAt(beforeName) == '*') {\n\t\t\t\tbeforeName = previousNonWhitespace(script, beforeName - 1);\n\t\t\t}\n\t\t\tif (beforeName < 0 || !previousIdentifier(script, beforeName).equals("function")) {\n\t\t\t\treturn false;\n\t\t\t}\n\t\t\tfunctionEnd = beforeName;\n\t\t\tanonymous = false;\n\t\t}\n\n\t\tint functionStart = identifierStart(script, functionEnd);\n\t\tint beforeFunction = previousNonWhitespace(script, functionStart - 1);\n\t\tif (beforeFunction >= 0 && script.charAt(beforeFunction) == '.') {\n\t\t\treturn false;\n\t\t}\n\t\tif (anonymous) {\n\t\t\treturn true;\n\t\t}\n\n\t\t// Include a preceding async keyword when deciding whether a named function is\n\t\t// a declaration or an expression.\n\t\tif (beforeFunction >= 0 && Character.isJavaIdentifierPart(script.charAt(beforeFunction))\n\t\t\t\t&& previousIdentifier(script, beforeFunction).equals("async")) {\n\t\t\tint asyncStart = identifierStart(script, beforeFunction);\n\t\t\tbeforeFunction = previousNonWhitespace(script, asyncStart - 1);\n\t\t}\n\n\t\treturn !isStatementBoundary(script, beforeFunction, statementBraces);\n\t}\n\n\tprivate static boolean isStatementBoundary(String script, int index, Deque<Boolean> statementBraces) {\n\t\tif (index < 0) {\n\t\t\treturn true;\n\t\t}\n\t\tchar previous = script.charAt(index);\n\t\tif (previous == ';' || previous == '}') {\n\t\t\treturn true;\n\t\t}\n\t\tif (previous == '{') {\n\t\t\treturn statementBraces.isEmpty() || statementBraces.peek();\n\t\t}\n\t\treturn false;\n\t}\n'''
          if old not in text:
              raise SystemExit('opensStatementBlock block not found')
          text = text.replace(old, new, 1)
          parser.write_text(text)

          tests = Path('AdvancedCore/src/test/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParserTest.java')
          text = tests.read_text()
          anchor = '''\n\t@Test\n\tvoid objectLiteralStringBraceDoesNotBecomeStatementBlock() {'''
          insert = '''\n\t@Test\n\tvoid functionExpressionBodyDoesNotBecomeStatementBlock() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\t\tString injection = "'; allowed=true; '";\n\n\t\tString script = JavascriptPlaceholderParser.replace(\n\t\t\t\t"var allowed=false,x=function() {} / 2; '%untrusted%'; allowed", ignored -> injection, bindings::put);\n\n\t\tassertEquals("var allowed=false,x=function() {} / 2; '\\\\'; allowed=true; \\\\''; allowed", script);\n\t\tassertTrue(bindings.isEmpty());\n\t}\n\n\t@Test\n\tvoid namedFunctionExpressionBodyDoesNotBecomeStatementBlock() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\t\tString injection = "'; allowed=true; '";\n\n\t\tString script = JavascriptPlaceholderParser.replace(\n\t\t\t\t"var allowed=false,x=function named() {} / 2; '%untrusted%'; allowed", ignored -> injection, bindings::put);\n\n\t\tassertEquals("var allowed=false,x=function named() {} / 2; '\\\\'; allowed=true; \\\\''; allowed", script);\n\t\tassertTrue(bindings.isEmpty());\n\t}\n\n\t@Test\n\tvoid arrowFunctionBodyDoesNotBecomeStatementBlock() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\t\tString injection = "'; allowed=true; '";\n\n\t\tString script = JavascriptPlaceholderParser.replace(\n\t\t\t\t"var allowed=false,x=()=>{} / 2; '%untrusted%'; allowed", ignored -> injection, bindings::put);\n\n\t\tassertEquals("var allowed=false,x=()=>{} / 2; '\\\\'; allowed=true; \\\\''; allowed", script);\n\t\tassertTrue(bindings.isEmpty());\n\t}\n\n\t@Test\n\tvoid functionDeclarationBodyStillAllowsRegexStatement() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\t\tString injection = "Bukkit.dispatchCommand(Console, \\\"op attacker\\\")";\n\n\t\tString script = JavascriptPlaceholderParser.replace(\n\t\t\t\t"function named() {} /[']/.test('x'); %untrusted%", ignored -> injection, bindings::put);\n\n\t\tassertEquals("function named() {} /[']/.test('x'); __advancedCorePlaceholder0", script);\n\t\tassertEquals(injection, bindings.get("__advancedCorePlaceholder0"));\n\t}\n'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          text = text.replace(anchor, insert + anchor, 1)
          tests.write_text(text)
          PY
          rm .github/workflows/fix-codex-293-function-expression-block.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Distinguish function expression bodies from statement blocks"
          git push origin HEAD:security/javascript-placeholder-hardening
