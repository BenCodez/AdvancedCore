name: Fix JavaScript parser diagnostic fallback
on:
  push:
    branches: [security/javascript-placeholder-bindings]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-bindings
      - name: Apply parser diagnostic fix
        shell: bash
        run: |
          python3 .github/fix_302_parser_diagnostic.py
          rm -f .github/fix_302_parser_diagnostic.py .github/workflows/fix-302-parser-diagnostics.yml
          git config user.name 'Ben'
          git config user.email 'benbergen12@gmail.com'
          git add -A
          git commit -m 'Fall back on JavaScript parser diagnostics'
          git push origin HEAD:security/javascript-placeholder-bindings
