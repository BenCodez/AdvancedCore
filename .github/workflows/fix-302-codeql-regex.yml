name: Fix JavaScript fallback regex performance
on:
  push:
    branches: [security/javascript-placeholder-bindings]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-bindings
      - name: Fix fallback regex
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderBinder.java')
          text = p.read_text()
          old = '    private static final Pattern FALLBACK_REGEX = Pattern.compile("/(?:\\\\\\\\.|[^/\\\\r\\\\n])+/[dgimsuvy]*");'
          new = '    private static final Pattern FALLBACK_REGEX = Pattern.compile("/(?:\\\\\\\\.|[^/\\\\\\\\\\\\r\\\\n])+/[dgimsuvy]*");'
          if old not in text:
              raise SystemExit('FALLBACK_REGEX source line not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-302-codeql-regex.yml
          git config user.name 'Ben'
          git config user.email 'benbergen12@gmail.com'
          git add -A
          git commit -m 'Make JavaScript fallback regex linear'
          git push origin HEAD:security/javascript-placeholder-bindings
