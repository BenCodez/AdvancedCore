name: Fix JavaScript fallback literal patterns
on:
  push:
    branches: [security/javascript-placeholder-bindings]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-bindings
      - name: Fix fallback literal patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderBinder.java')
          lines = p.read_text().splitlines()
          found_string = found_template = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith('private static final Pattern FALLBACK_STRING ='):
                  lines[i] = r'''    private static final Pattern FALLBACK_STRING = Pattern.compile("'(?:\\\\.|[^'\\\\])*'|\"(?:\\\\.|[^\"\\\\])*\"");'''
                  found_string = True
              elif stripped.startswith('private static final Pattern FALLBACK_TEMPLATE ='):
                  lines[i] = r'''    private static final Pattern FALLBACK_TEMPLATE = Pattern.compile("`(?:\\\\.|[^`\\\\])*`");'''
                  found_template = True
          if not found_string or not found_template:
              raise SystemExit(f'patterns missing string={found_string} template={found_template}')
          p.write_text('\n'.join(lines) + '\n')
          PY
          rm -f .github/workflows/fix-302-fallback-literals.yml
          git config user.name 'Ben'
          git config user.email 'benbergen12@gmail.com'
          git add -A
          git commit -m 'Fix JavaScript fallback literal patterns'
          git push origin HEAD:security/javascript-placeholder-bindings
