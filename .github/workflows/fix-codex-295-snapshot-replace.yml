name: Apply Codex 295 snapshot replacement fix

on:
  push:
    branches:
      - security/reward-path-identity-hardening
    paths:
      - .github/workflows/fix-codex-295-snapshot-replace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/reward-path-identity-hardening
          fetch-depth: 0
      - name: Replace generated snapshot data instead of merging stale keys
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/rewards/RewardFileData.java')
          text = p.read_text()
          old = '''\tpublic void setData(ConfigurationSection value) {\n\t\t// getFileData().set("", value);\n\t\tMap<String, Object> map = value.getConfigurationSection("").getValues(true);\n\t\tfor (Entry<String, Object> entry : map.entrySet()) {\n\t\t\tset(entry.getKey(), entry.getValue());\n\t\t}\n\t\treward.loadValues();\n\t}\n'''
          new = '''\tpublic void setData(ConfigurationSection value) {\n\t\tif (fileData == null || value == null) {\n\t\t\tplugin.debug("Editing invalid reward: " + reward.getName());\n\t\t\treturn;\n\t\t}\n\n\t\t// Snapshot writes replace the previous contents completely. Reusing a generated\n\t\t// queue file must not retain reward actions that were removed from the source\n\t\t// section after an earlier snapshot was created.\n\t\tfor (String key : new HashSet<>(fileData.getKeys(false))) {\n\t\t\tfileData.set(key, null);\n\t\t}\n\t\tMap<String, Object> map = value.getConfigurationSection("").getValues(true);\n\t\tfor (Entry<String, Object> entry : map.entrySet()) {\n\t\t\tfileData.set(entry.getKey(), entry.getValue());\n\t\t}\n\t\tsave(fileData);\n\t\treload();\n\t\treward.loadValues();\n\t}\n'''
          if old not in text:
              raise SystemExit('RewardFileData.setData block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('AdvancedCore/src/test/java/com/bencodez/advancedcore/api/rewards/RewardLoaderSecurityTest.java')
          text = p.read_text()
          insert = '''\n\t@Test\n\tvoid reusedGeneratedSnapshotDropsRemovedRewardKeys() throws IOException {\n\t\tAdvancedCorePlugin plugin = mock(AdvancedCorePlugin.class);\n\t\tAdvancedCorePlugin.setInstance(plugin);\n\n\t\tFile directlyDefined = new File(tempDir, "Rewards/DirectlyDefined");\n\t\tassertTrue(directlyDefined.mkdirs());\n\t\tFile snapshot = new File(directlyDefined, "Daily_AdvancedRewards_foo.yml");\n\t\tYamlConfiguration oldData = new YamlConfiguration();\n\t\toldData.set("Commands", List.of("old command"));\n\t\toldData.set("Messages", List.of("old message"));\n\t\toldData.save(snapshot);\n\n\t\tReward reward = new Reward(directlyDefined, "Daily_AdvancedRewards_foo");\n\t\tYamlConfiguration replacement = new YamlConfiguration();\n\t\treplacement.set("Messages", List.of("new message"));\n\t\treward.getConfig().setData(replacement);\n\n\t\tYamlConfiguration saved = YamlConfiguration.loadConfiguration(snapshot);\n\t\tassertFalse(saved.contains("Commands"));\n\t\tassertEquals(List.of("new message"), saved.getStringList("Messages"));\n\t}\n'''
          anchor = '\n\t@Test\n\tvoid loadRewardsDoesNotSuppressNormalDirectFolderFileWithoutGeneratedMarker() throws IOException {'
          if anchor not in text:
              raise SystemExit('RewardLoaderSecurityTest insertion anchor not found')
          text = text.replace(anchor, insert + anchor, 1)
          p.write_text(text)
          PY
          rm .github/workflows/fix-codex-295-snapshot-replace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace reused generated reward snapshots"
          git push origin HEAD:security/reward-path-identity-hardening
