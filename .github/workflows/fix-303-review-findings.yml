name: Fix PR 303 review findings

on:
  push:
    branches:
      - security/structured-javascript-segments

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/structured-javascript-segments

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply review fixes
        run: python .github/scripts/fix303_review_findings.py

      - name: Validate
        run: mvn -B -f AdvancedCore/pom.xml package

      - name: Commit validated fixes and remove temporary files
        run: |
          rm .github/scripts/fix303_review_findings.py
          rm .github/workflows/fix-303-review-findings.yml
          git config user.name "BenCodez"
          git config user.email "17074231+BenCodez@users.noreply.github.com"
          git add -A
          git commit -m "Fix JavaScript placeholder token and escape handling"
          git push origin HEAD:security/structured-javascript-segments
