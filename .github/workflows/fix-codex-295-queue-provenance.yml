name: Apply Codex 295 queue provenance fix

on:
  push:
    branches:
      - security/reward-path-identity-hardening
    paths:
      - .github/workflows/fix-codex-295-queue-provenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/reward-path-identity-hardening
          fetch-depth: 0
      - name: Require real persisted queue provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Capability object: only code in api.user can construct one normally.
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/user/PersistedQueueReference.java')
          p.write_text('''package com.bencodez.advancedcore.api.user;\n\n/**\n * Capability wrapper for a reward reference read from this user's persisted\n * offline/timed queue. The constructor is package-private so ordinary reward\n * callers cannot manufacture queue provenance through RewardOptions.\n */\npublic final class PersistedQueueReference {\n\n\tprivate final String reference;\n\n\tPersistedQueueReference(String reference) {\n\t\tthis.reference = reference;\n\t}\n\n\tpublic String getReference() {\n\t\treturn reference;\n\t}\n}\n''')

          # Public reward facade gets a queue-specific capability entry point.
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/rewards/RewardHandler.java')
          text = p.read_text()
          imp = 'import com.bencodez.advancedcore.api.user.AdvancedCoreUser;\n'
          if 'import com.bencodez.advancedcore.api.user.PersistedQueueReference;' not in text:
              text = text.replace(imp, imp + 'import com.bencodez.advancedcore.api.user.PersistedQueueReference;\n', 1)
          old = '''    public void giveReward(AdvancedCoreUser user, String reward, RewardOptions rewardOptions) {\n        rewardExecutor.giveReward(user, reward, rewardOptions);\n    }\n'''
          new = old + '''\n    public void givePersistedQueueReward(AdvancedCoreUser user, PersistedQueueReference rewardReference,\n            RewardOptions rewardOptions) {\n        if (rewardReference == null) {\n            return;\n        }\n        rewardExecutor.givePersistedQueueReward(user, rewardReference.getReference(), rewardOptions);\n    }\n'''
          if old not in text:
              raise SystemExit('RewardHandler string giveReward block not found')
          p.write_text(text.replace(old, new, 1))

          # Ordinary String dispatch no longer infers queue provenance from user-controlled options.
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/rewards/RewardExecutor.java')
          text = p.read_text()
          start = text.index('    public void giveReward(AdvancedCoreUser user, String reward, RewardOptions rewardOptions) {')
          end = text.index('    public void updateReward(Configuration data, String path, RewardOptions rewardOptions) {', start)
          replacement = '''    public void giveReward(AdvancedCoreUser user, String reward, RewardOptions rewardOptions) {\n        RewardExecutionContext context = new RewardExecutionContext(rewardOptions).initializeOnlineState(user);\n        if (reward == null || reward.isEmpty()) {\n            return;\n        }\n\n        if (reward.startsWith("/")) {\n            MiscUtils.getInstance().executeConsoleCommands(user.getPlayerName(), reward, context.getPlaceholders());\n            return;\n        }\n\n        giveReward(user, handler.getReward(reward), context.getOptions());\n    }\n\n    void givePersistedQueueReward(AdvancedCoreUser user, String reward, RewardOptions rewardOptions) {\n        RewardExecutionContext context = new RewardExecutionContext(rewardOptions).initializeOnlineState(user);\n        if (reward == null || reward.isEmpty()) {\n            return;\n        }\n\n        String rewardName = reward;\n        Boolean generatedSnapshot = null;\n        if (reward.startsWith(QUEUED_REFERENCE_PREFIX)) {\n            String encoded = reward.substring(QUEUED_REFERENCE_PREFIX.length());\n            int modeEnd = encoded.indexOf('/');\n            if (modeEnd > 0) {\n                String mode = encoded.substring(0, modeEnd);\n                String encodedName = encoded.substring(modeEnd + 1);\n                if ((mode.equals("snapshot") || mode.equals("normal")) && !encodedName.isEmpty()) {\n                    try {\n                        rewardName = new String(Base64.getUrlDecoder().decode(encodedName), StandardCharsets.UTF_8);\n                        generatedSnapshot = Boolean.valueOf(mode.equals("snapshot"));\n                    } catch (IllegalArgumentException ignored) {\n                        rewardName = reward;\n                    }\n                }\n            }\n        }\n\n        Reward resolved;\n        if (generatedSnapshot != null) {\n            if (generatedSnapshot.booleanValue()) {\n                resolved = handler.getQueuedGeneratedReward(rewardName, user.getUUID());\n            } else {\n                resolved = handler.getReward(rewardName);\n            }\n        } else if (handler.rewardExist(rewardName) || handler.hasDirectRewardHandle(rewardName)) {\n            // Legacy persisted queue entry: a real registered reward wins over any\n            // stale generated file with the same name.\n            resolved = handler.getReward(rewardName);\n        } else {\n            // Legacy generated queue entries predate explicit provenance. This branch is\n            // reachable only through the PersistedQueueReference capability path.\n            resolved = handler.getQueuedGeneratedReward(rewardName, user.getUUID());\n            if (resolved == null) {\n                resolved = handler.getReward(rewardName);\n            }\n        }\n        giveReward(user, resolved, context.getOptions());\n    }\n\n'''
          p.write_text(text[:start] + replacement + text[end:])

          # Only actual queue-draining code can construct PersistedQueueReference.
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/user/AdvancedCoreUser.java')
          text = p.read_text()
          old = 'plugin.getRewardHandler().giveReward(this, rewardReference, replayOptions);'
          new = 'plugin.getRewardHandler().givePersistedQueueReward(this, new PersistedQueueReference(rewardReference), replayOptions);'
          if old not in text:
              raise SystemExit('timed replay call not found')
          text = text.replace(old, new, 1)
          old = 'rewardHandler.giveReward(user, rewardReference, options);'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 offline replay calls, found {count}')
          text = text.replace(old, 'rewardHandler.givePersistedQueueReward(user, new PersistedQueueReference(rewardReference), options);')
          p.write_text(text)

          # Keep queue-resolver tests on the internal executor path and add the exact forged-options regression.
          p = Path('AdvancedCore/src/test/java/com/bencodez/advancedcore/tests/rewards/QueuedGeneratedRewardDispatchTest.java')
          text = p.read_text()
          text = text.replace('package com.bencodez.advancedcore.tests.rewards;', 'package com.bencodez.advancedcore.api.rewards;', 1)
          for imp in [
              'import com.bencodez.advancedcore.api.rewards.Reward;\n',
              'import com.bencodez.advancedcore.api.rewards.RewardBuilder;\n',
              'import com.bencodez.advancedcore.api.rewards.RewardExecutor;\n',
              'import com.bencodez.advancedcore.api.rewards.RewardHandler;\n',
              'import com.bencodez.advancedcore.api.rewards.RewardOptions;\n',
          ]:
              text = text.replace(imp, '')
          queue_calls = [
              'executor.giveReward(user, "QueuedReward", options);',
              'executor.giveReward(user, queuedReference("Daily", false), options);',
              'executor.giveReward(user, queuedReference("Daily", true), options);',
              'executor.giveReward(user, "Daily", options);',
              'executor.giveReward(user, rewardName, options);',
          ]
          # First two QueuedReward calls are persisted replay tests; change both occurrences.
          text = text.replace('executor.giveReward(user, "QueuedReward", options);', 'executor.givePersistedQueueReward(user, "QueuedReward", options);', 2)
          text = text.replace('executor.giveReward(user, queuedReference("Daily", false), options);', 'executor.givePersistedQueueReward(user, queuedReference("Daily", false), options);', 1)
          text = text.replace('executor.giveReward(user, queuedReference("Daily", true), options);', 'executor.givePersistedQueueReward(user, queuedReference("Daily", true), options);', 1)
          text = text.replace('executor.giveReward(user, "Daily", options);', 'executor.givePersistedQueueReward(user, "Daily", options);', 1)
          # Only the legacy marker-ending queue test should use persisted path; normal marker text test remains public.
          marker_test = '''            executor.giveReward(user, rewardName, options);\n        }\n\n        verify(handler).getReward(rewardName);\n        verify(normal).giveReward(user, options);\n        verify(handler, never()).getQueuedGeneratedReward("Promo", "uuid");\n        verify(handler, never()).getReward("Promo");\n    }\n\n    @Test\n    void normalDispatchPreservesRewardNameContainingSnapshotMarkerText()'''
          marker_repl = '''            executor.givePersistedQueueReward(user, rewardName, options);\n        }\n\n        verify(handler).getReward(rewardName);\n        verify(normal).giveReward(user, options);\n        verify(handler, never()).getQueuedGeneratedReward("Promo", "uuid");\n        verify(handler, never()).getReward("Promo");\n    }\n\n    @Test\n    void normalDispatchPreservesRewardNameContainingSnapshotMarkerText()'''
          if marker_test not in text:
              raise SystemExit('legacy marker-ending test block not found')
          text = text.replace(marker_test, marker_repl, 1)
          insert = '''\n    @Test\n    void forgedOfflineOptionsCannotGrantQueueSnapshotAccess() {\n        Reward normal = mock(Reward.class);\n        Reward queued = mock(Reward.class);\n        RewardOptions options = new RewardOptions().setOnline(false).setCheckTimed(false);\n        when(handler.getReward("QueuedReward")).thenReturn(normal);\n        when(handler.getQueuedGeneratedReward("QueuedReward", "uuid")).thenReturn(queued);\n\n        try (MockedStatic<Bukkit> bukkit = org.mockito.Mockito.mockStatic(Bukkit.class)) {\n            bukkit.when(Bukkit::isPrimaryThread).thenReturn(false);\n            executor.giveReward(user, "QueuedReward", options);\n        }\n\n        verify(handler).getReward("QueuedReward");\n        verify(handler, never()).getQueuedGeneratedReward("QueuedReward", "uuid");\n        verify(normal).giveReward(user, options);\n        verify(queued, never()).giveReward(user, options);\n    }\n'''
          anchor = '\n    @Test\n    void normalStandaloneDispatchCannotResolveGeneratedSnapshot() {'
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          text = text.replace(anchor, insert + anchor, 1)
          p.write_text(text)
          PY
          rm .github/workflows/fix-codex-295-queue-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require persisted queue provenance for snapshot replay"
          git push origin HEAD:security/reward-path-identity-hardening