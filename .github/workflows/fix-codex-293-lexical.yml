name: Apply Codex 293 lexical fixes

on:
  push:
    branches:
      - security/javascript-placeholder-hardening
    paths:
      - .github/workflows/fix-codex-293-lexical.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/javascript-placeholder-hardening
          fetch-depth: 0
      - name: Patch parser and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          parser = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParser.java')
          text = parser.read_text()

          text = text.replace(
              'Pattern.compile("%([^%]+)%|(?<!\\\\$)\\\\{([^{}]+)\\\\}")',
              'Pattern.compile("%([^%]+)%|(?<!\\\\$)\\\\{([^{}%]+)\\\\}")')

          text = text.replace(
              '\t\tboolean escaped = false;\n\t\tboolean regexCharacterClass = false;\n',
              '\t\tboolean escaped = false;\n\t\tboolean regexCharacterClass = false;\n'
              '\t\tDeque<Boolean> controlParens = new ArrayDeque<>();\n'
              '\t\tint lastControlHeadClose = -1;\n')

          text = text.replace(
              "\t\t\tif (current == '/' && startsRegexLiteral(script, i)) {",
              "\t\t\tif (current == '/' && startsRegexLiteral(script, i, lastControlHeadClose)) {")

          needle = """\t\t\tif (current == '`') {\n\t\t\t\ttemplates.push(new TemplateFrame());\n\t\t\t\tcontext = Context.TEMPLATE_TEXT;\n\t\t\t\tcontinue;\n\t\t\t}\n"""
          replacement = needle + """\t\t\tif (current == '(') {\n\t\t\t\tint keywordEnd = previousNonWhitespace(script, i - 1);\n\t\t\t\tcontrolParens.push(CONTROL_HEAD_KEYWORDS.contains(previousIdentifier(script, keywordEnd)));\n\t\t\t} else if (current == ')' && !controlParens.isEmpty()) {\n\t\t\t\tif (controlParens.pop()) {\n\t\t\t\t\tlastControlHeadClose = i;\n\t\t\t\t}\n\t\t\t}\n"""
          if needle not in text:
              raise SystemExit('Unable to locate template transition')
          text = text.replace(needle, replacement, 1)

          text = text.replace(
              'private static boolean startsRegexLiteral(String script, int slashIndex) {',
              'private static boolean startsRegexLiteral(String script, int slashIndex, int lastControlHeadClose) {')
          text = text.replace(
              "\t\tif (previous == ')' && closesControlHead(script, previousIndex)) {\n\t\t\treturn true;\n\t\t}\n",
              "\t\tif (previous == ')' && previousIndex == lastControlHeadClose) {\n\t\t\treturn true;\n\t\t}\n")

          text, count = re.subn(
              r'\n\tprivate static boolean closesControlHead\(String script, int closeParenIndex\) \{.*?\n\t\}\n\n\tprivate static boolean closesStatementBlock',
              '\n\tprivate static boolean closesStatementBlock',
              text,
              count=1,
              flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Unable to remove closesControlHead')

          parser.write_text(text)

          tests = Path('AdvancedCore/src/test/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParserTest.java')
          t = tests.read_text()
          marker = """\t@Test\n\tvoid objectLiteralFollowedByDivisionIsNotTreatedAsRegex() {\n"""
          additions = """\t@Test\n\tvoid controlHeadIgnoresParenthesesInsideStrings() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\t\tString injection = \"Bukkit.dispatchCommand(Console, \\\"op attacker\\\")\";\n\n\t\tString script = JavascriptPlaceholderParser.replace(\"if (fn(\\\")\\\")) /[']/.test('x'); %untrusted%\",\n\t\t\t\tignored -> injection, bindings::put);\n\n\t\tassertEquals(\"if (fn(\\\")\\\")) /[']/.test('x'); __advancedCorePlaceholder0\", script);\n\t\tassertEquals(injection, bindings.get(\"__advancedCorePlaceholder0\"));\n\t}\n\n\t@Test\n\tvoid controlHeadIgnoresParenthesesInsideRegexLiterals() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\t\tString injection = \"Bukkit.dispatchCommand(Console, \\\"op attacker\\\")\";\n\n\t\tString script = JavascriptPlaceholderParser.replace(\"if (/\\\\)/.test(value)) /[']/.test('x'); %untrusted%\",\n\t\t\t\tignored -> injection, bindings::put);\n\n\t\tassertEquals(\"if (/\\\\)/.test(value)) /[']/.test('x'); __advancedCorePlaceholder0\", script);\n\t\tassertEquals(injection, bindings.get(\"__advancedCorePlaceholder0\"));\n\t}\n\n\t@Test\n\tvoid objectLiteralDoesNotConsumeNestedPercentPlaceholder() {\n\t\tHashMap<String, Object> bindings = new HashMap<>();\n\n\t\tString script = JavascriptPlaceholderParser.replace(\"({allowed: %permission_result%}).allowed\",\n\t\t\t\tplaceholder -> placeholder.equals(\"%permission_result%\") ? \"true\" : placeholder, bindings::put);\n\n\t\tassertEquals(\"({allowed: __advancedCorePlaceholder0}).allowed\", script);\n\t\tassertEquals(Boolean.TRUE, bindings.get(\"__advancedCorePlaceholder0\"));\n\t}\n\n"""
          if marker not in t:
              raise SystemExit('Unable to locate parser test insertion point')
          t = t.replace(marker, additions + marker, 1)
          tests.write_text(t)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AdvancedCore/src/main/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParser.java AdvancedCore/src/test/java/com/bencodez/advancedcore/api/javascript/JavascriptPlaceholderParserTest.java
          git rm .github/workflows/fix-codex-293-lexical.yml
          git commit -m "Harden JavaScript lexical control tracking"
          git push origin HEAD:security/javascript-placeholder-hardening
