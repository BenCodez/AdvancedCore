name: Fix Codex 295 queue logging

on:
  push:
    branches:
      - security/reward-path-identity-hardening
    paths:
      - .github/workflows/fix-codex-295-queue-log.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/reward-path-identity-hardening
          fetch-depth: 0
      - name: Remove stale queue marker reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AdvancedCore/src/main/java/com/bencodez/advancedcore/api/user/AdvancedCoreUser.java')
          text = p.read_text()
          old = 'String rewardName = rewardReference.split(QUEUED_SNAPSHOT_MARKER, 2)[0];'
          new = 'String rewardName = rewardReference;'
          if old not in text:
              raise SystemExit('stale queue marker log reference not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AdvancedCore/src/main/java/com/bencodez/advancedcore/api/user/AdvancedCoreUser.java
          git rm .github/workflows/fix-codex-295-queue-log.yml
          git commit -m "Remove stale queued reward marker reference"
          git push origin HEAD:security/reward-path-identity-hardening
