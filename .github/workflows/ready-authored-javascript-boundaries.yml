name: Gate authored JavaScript PR readiness

on:
  push:
    branches:
      - security/authored-javascript-boundaries

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify implementation helpers are absent
        run: |
          test ! -e .github/scripts/finalize_authored_javascript_boundaries.py
          test ! -e .github/workflows/finalize-authored-javascript-boundaries.yml

      - name: Build and test final content
        run: mvn -B -f AdvancedCore/pom.xml package

      - name: Remove readiness gate and squash branch
        run: |
          rm .github/workflows/ready-authored-javascript-boundaries.yml
          git config user.name "BenCodez"
          git config user.email "17074231+BenCodez@users.noreply.github.com"
          git fetch origin master
          git add -A
          git reset --soft origin/master
          git add -A
          git commit -m "Preserve authored JavaScript boundaries"
          git push --force origin HEAD:security/authored-javascript-boundaries

      - name: Mark pull request ready and request Codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 303 --repo BenCodez/AdvancedCore
          gh pr comment 303 --repo BenCodez/AdvancedCore --body "@codex review"
