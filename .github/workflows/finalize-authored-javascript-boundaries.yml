name: Finalize authored JavaScript boundary implementation

on:
  push:
    branches:
      - security/authored-javascript-boundaries

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Apply final implementation
        run: python3 .github/scripts/finalize_authored_javascript_boundaries.py

      - name: Remove temporary finalization files
        run: |
          rm .github/scripts/finalize_authored_javascript_boundaries.py
          rm .github/workflows/finalize-authored-javascript-boundaries.yml

      - name: Build and test
        run: mvn -B -f AdvancedCore/pom.xml package

      - name: Commit tested implementation
        run: |
          git config user.name "BenCodez"
          git config user.email "17074231+BenCodez@users.noreply.github.com"
          git add -A
          git commit -m "Preserve authored JavaScript boundaries"
          git push origin HEAD:security/authored-javascript-boundaries
